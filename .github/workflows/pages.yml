# GitHub Pages: the opening statistics of the latest release stats-YYYY-MM under /stats/ (the
# app downloads them from there; Pages allows other origins, CORS *). Later also the web app.
name: Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Opening statistics]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Not after the test runs (push): their files are not published.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Latest statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^stats-[0-9]{4}-[0-9]{2}$"))] | sort_by(.createdAt) | last | .tagName')
          [ -n "$tag" ] && [ "$tag" != null ] || { echo "Aucune release stats-YYYY-MM"; exit 1; }
          echo "Statistiques : $tag"
          mkdir -p site/stats
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D site/stats
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
