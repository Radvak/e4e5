    <!-- Cap -->
    <path d="M764 550 C832 516 900 492 966 492 C1032 492 1100 516 1168 550 V696 C1100 666 1032 652 966 652 C900 652 832 666 764 696 Z"/>
    <!-- Pawn: head -->
