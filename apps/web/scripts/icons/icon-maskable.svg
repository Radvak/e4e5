  <g fill="#E4B120">
    <path d="M1282 547.6 L1315 532.3 V686 H1282 Z"/>
    <circle cx="1298" cy="718" r="42"/>
    <path d="M1276 750 H1321 L1346 894 H1250 Z"/>
  </g>
  </g>
</svg>
